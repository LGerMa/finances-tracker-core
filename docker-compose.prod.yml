services:
  db:
    image: postgres:16-alpine
    container_name: keru-db
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - keru-network
      - api-internal

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keru-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_HOST: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - keru-network
      - api-internal

volumes:
  pgdata:

networks:
  keru-network:
    external: true
  api-internal:
